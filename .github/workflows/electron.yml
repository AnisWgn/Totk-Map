name: Build Electron Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  electron-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint and run unit & Electron tests
        run: |
          npm run lint
          npm test
      - name: Build Windows Electron executables (.exe portable & installer)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run electron:build
      - name: Upload Electron Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HyruleSync-Electron-Windows
          path: |
            outputs/electron/*.exe
          if-no-files-found: error
